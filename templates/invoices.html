{% extends "base.html" %}

{% block content %}
<div class="card">
    <h3>Lập hóa đơn</h3>

        <input placeholder="Họ tên khách">

</div>

<table>
    <tr><th>Họ tên</th><th>Dịch vụ</th><th>Giá</th><th>Giảm giá</th><th>VAT</th><th>Tổng tiền</th></tr>
    <tr><td>Trần Thu Hằng</td><td>Massage mặt</td><td>300.000</td><td>0</td><td>30.000</td><td>330.000</td></tr>
